<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://tapi.bale.ai/miniapp.js?3"></script>

    <title>ورود کارکنان آمال</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
            direction: rtl;
        }

        .box {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>ورود کارکنان</h2>

    <form id="loginForm">

        <label for="username">کد راهکاران</label>

        <input
            id="username"
            type="text"
            inputmode="numeric"
            placeholder="RahkaranPartyID"
            autocomplete="username"
            required
        >

        <label for="password">رمز عبور</label>

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            ورود
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");


if (window.Bale && window.Bale.WebApp) {

    if (window.Bale.WebApp.ready) {
        window.Bale.WebApp.ready();
    }

    if (window.Bale.WebApp.expand) {
        window.Bale.WebApp.expand();
    }
}


form.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    if (!/^[0-9]+$/.test(username)) {

        message.textContent =
            "کد راهکاران معتبر نیست.";

        return;
    }


    if (!password) {

        message.textContent =
            "رمز عبور را وارد کنید.";

        return;
    }


    if (
        !window.Bale ||
        !window.Bale.WebApp ||
        typeof window.Bale.WebApp.sendData !== "function"
    ) {

        message.textContent =
            "این صفحه باید از داخل Mini App بله باز شود.";

        return;
    }


    message.textContent =
        "در حال بررسی اطلاعات...";


    const data = {
        action: "employee_login",
        rahkaran_party_id: username,
        password: password
    };


    window.Bale.WebApp.sendData(
        JSON.stringify(data)
    );

});

</script>

</body>
</html>
