<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود کارکنان آمال</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
            direction: rtl;
        }

        .box {
            max-width: 420px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            font-size: 16px;
        }

        #message,
        #status {
            margin-top: 15px;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>ورود کارکنان</h2>

    <div id="status">
        در حال اتصال به بله...
    </div>

    <form id="loginForm">

        <label for="username">کد راهکاران</label>

        <input
            id="username"
            type="text"
            inputmode="numeric"
            placeholder="کد راهکاران"
            required
        >

        <label for="password">رمز عبور</label>

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
            required
        >

        <button type="submit">
            ورود
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const statusElement = document.getElementById("status");


function initializeBale() {

    if (
        window.Bale &&
        window.Bale.WebApp
    ) {

        statusElement.textContent =
            "ارتباط با بله برقرار شد.";

        if (window.Bale.WebApp.ready) {
            window.Bale.WebApp.ready();
        }

        if (window.Bale.WebApp.expand) {
            window.Bale.WebApp.expand();
        }

    } else {

        statusElement.textContent =
            "این صفحه باید از داخل Mini App بله باز شود.";
    }
}


const baleScript = document.createElement("script");

baleScript.src =
    "https://tapi.bale.ai/miniapp.js?3";

baleScript.onload = initializeBale;

baleScript.onerror = function () {
    statusElement.textContent =
        "ارتباط با سرویس Mini App بله برقرار نشد.";
};

document.head.appendChild(baleScript);


form.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    if (!/^[0-9]+$/.test(username)) {
        message.textContent =
            "کد راهکاران معتبر نیست.";
        return;
    }

    if (!password) {
        message.textContent =
            "رمز عبور را وارد کنید.";
        return;
    }

    if (
        !window.Bale ||
        !window.Bale.WebApp ||
        typeof window.Bale.WebApp.sendData !== "function"
    ) {
        message.textContent =
            "ارتباط با Mini App بله برقرار نیست.";
        return;
    }

    message.textContent =
        "در حال بررسی اطلاعات...";

    window.Bale.WebApp.sendData(
        JSON.stringify({
            action: "employee_login",
            rahkaran_party_id: username,
            password: password
        })
    );
});

</script>

</body>
</html>
