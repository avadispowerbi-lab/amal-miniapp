<script>
if (window.Bale && window.Bale.WebApp) {
    if (window.Bale.WebApp.ready) {
        window.Bale.WebApp.ready();
    }

    if (window.Bale.WebApp.expand) {
        window.Bale.WebApp.expand();
    }
}

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (!/^[0-9]+$/.test(username)) {
        message.textContent = "کد راهکاران معتبر نیست.";
        return;
    }

    if (
        !window.Bale ||
        !window.Bale.WebApp ||
        typeof window.Bale.WebApp.sendData !== "function"
    ) {
        message.textContent =
            "این صفحه باید از داخل Mini App بله باز شود.";
        return;
    }

    message.textContent = "در حال بررسی اطلاعات...";

    const data = {
        action: "employee_login",
        rahkaran_party_id: username,
        password: password
    };

    window.Bale.WebApp.sendData(
        JSON.stringify(data)
    );
});
</script>
